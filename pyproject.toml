[project]
name = "cifarres"
version = "0.1.0"
description = "Comparative CIFAR-10H human disagreement prediction pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "seaborn>=0.13",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.66",
    "wandb>=0.19",
]

[project.scripts]
cifarres = "main:main"

[tool.uv]
package = false
