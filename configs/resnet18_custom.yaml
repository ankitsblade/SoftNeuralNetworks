experiment_name: resnet18_custom
seed: 42
device: auto

dataset:
  name: cifar10h
  root: data
  cifar10h_path: data/cifar10h/cifar10h-probs.npy
  train_size: 6000
  val_size: 2000
  test_size: 2000
  batch_size: 128
  num_workers: 4
  download: true
  pretrain_val_size: 5000

model:
  backbone: resnet18
  head: temperature_mlp
  num_classes: 10
  dropout: 0.30
  pretrained_checkpoint: outputs/checkpoints/resnet18_kl_pretrain_best.pt
  temperature:
    type: learnable
    init: 1.5

training:
  stage: finetune
  epochs: 100
  lr_backbone: 0.0001
  lr_head: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping:
    monitor: val_kl
    patience: 10
    mode: min

loss:
  name: custom
  lambda_entropy: 0.1

logging:
  save_dir: outputs
  save_best: true
  save_data_figures: false
  wandb:
    enabled: false
    project: softneuralnetworks
    entity:
    mode: offline
    tags:
      - cifar10h
      - resnet18
      - custom
    watch_model: false
